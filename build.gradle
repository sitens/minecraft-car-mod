plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    // Exact version required: Gradle's plugins{} DSL doesn't accept dynamic
    // versions like "2.0.+". Confirmed latest at
    // https://plugins.gradle.org/plugin/net.neoforged.moddev (checked 2026-09-19).
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    // Parchment mappings (nicer decompiled parameter names) skipped for now —
    // no confirmed published mapping version for 1.21.11 yet. Add back via
    // `parchment { mappingsVersion = "..."; minecraftVersion = minecraft_version }`
    // once one exists at https://maven.parchmentmc.org.

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run/server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // NeoForge dependency itself is supplied by the neoForge{} block above.
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        mod_id           : mod_id,
        mod_name         : mod_name,
        mod_license      : mod_license,
        mod_version      : mod_version,
        mod_authors      : mod_authors,
        mod_description  : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}
